version: 1
id: tenn
inputs: {user_request: {type: string, required: true}}
runtime_defaults: {model: claude-haiku-4-5-20251001, runtime_environment: default}
repositories: {application: {required: true, runtime_role: primary}}
nodes:
  - id: requirements
    repositories: [application]
    actions: [{id: analyse, type: prompt, instructions: "Turn the request into acceptance criteria ..."}]
  - id: implement
    repositories: [application]
    actions:
      - id: implement_code
        type: prompt
        publish_changes: true
        consumes: [{node: requirements, artifact: requirements_doc}]
        instructions: "Implement ... run ./gradlew test ... publish the PR."
  - id: review
    type: approval
    approval: {prompt: "Approve the PR?"}
edges:
  - {from: requirements, to: implement, required: true}
  - {from: implement, to: review, required: true}
